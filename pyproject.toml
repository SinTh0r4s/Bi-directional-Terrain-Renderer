[project]
name = "claire"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "moderngl>=5.12.0",
    "numpy>=2.0.2",
    "pyglm>=2.8.3",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pyglm-typing>=0.2.1",
    "pytest>=8.4.2",
    "ruff>=0.16.7",
    "setuptools<82",  # older versions of PyCharm require it for IDE interactions
]
demo = [
    "pyside6>=6.10.3",
    "scikit-image>=0.24.0",
]
